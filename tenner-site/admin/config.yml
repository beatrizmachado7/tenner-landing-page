# Painel de administração TENNER. (Decap CMS)
# Login com Netlify Identity; cada publicação faz um commit no GitHub e o Netlify reconstrói o site.
# Os ficheiros estão dentro da pasta tenner-site/ do repositório.
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Novo em {{collection}}: “{{slug}}”"
    update: "Atualiza {{collection}}: “{{slug}}”"
    delete: "Apaga de {{collection}}: “{{slug}}”"
    uploadMedia: "Envia “{{path}}”"
    deleteMedia: "Apaga “{{path}}”"

locale: pt
site_url: https://tenner10.netlify.app
display_url: https://tenner10.netlify.app
logo_url: /images/logo-admin.svg

media_folder: tenner-site/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------------- ARQUIVO ----------------
  - name: arquivo
    label: Arquivo
    description: "Escolhe a categoria e adiciona ou apaga imagens. No site, “Todos” mostra as três categorias juntas."
    editor: { preview: false }
    files:
      - name: prematch
        label: Pre match
        file: tenner-site/content/galeria/prematch.json
        fields:
          - { label: Nome da categoria, name: label, widget: hidden, default: "Pre match" }
          - label: Imagens
            name: items
            widget: list
            label_singular: imagem
            add_to_top: true
            collapsed: false
            summary: "{{fields.title}}"
            hint: "Carrega em “Adicionar imagem” para pôr uma nova. Arrasta para mudar a ordem; o X apaga."
            fields:
              - { label: Imagem, name: image, widget: image }
              - { label: Título, name: title, widget: string, required: false, hint: "Aparece por cima da imagem no site." }
              - label: Formato
                name: format
                widget: select
                default: quadrado
                options:
                  - { label: "Vertical (9:16)", value: vertical }
                  - { label: "Retrato (4:5)", value: retrato }
                  - { label: "Quadrado (1:1)", value: quadrado }
              - { label: Etiqueta, name: tag, widget: string, required: false, hint: "Ex.: Design, Motion, Vídeo, Social" }
              - { label: "Vídeo em .mp4", name: video, widget: file, required: false, hint: "Se puseres um vídeo, a imagem serve de capa e aparece o botão play." }
      - name: video
        label: Vídeo
        file: tenner-site/content/galeria/video.json
        fields:
          - { label: Nome da categoria, name: label, widget: hidden, default: "Vídeo" }
          - label: Imagens
            name: items
            widget: list
            label_singular: imagem
            add_to_top: true
            collapsed: false
            summary: "{{fields.title}}"
            hint: "Carrega em “Adicionar imagem” para pôr uma nova. Arrasta para mudar a ordem; o X apaga."
            fields:
              - { label: Imagem, name: image, widget: image }
              - { label: Título, name: title, widget: string, required: false, hint: "Aparece por cima da imagem no site." }
              - label: Formato
                name: format
                widget: select
                default: quadrado
                options:
                  - { label: "Vertical (9:16)", value: vertical }
                  - { label: "Retrato (4:5)", value: retrato }
                  - { label: "Quadrado (1:1)", value: quadrado }
              - { label: Etiqueta, name: tag, widget: string, required: false, hint: "Ex.: Design, Motion, Vídeo, Social" }
              - { label: "Vídeo em .mp4", name: video, widget: file, required: false, hint: "Se puseres um vídeo, a imagem serve de capa e aparece o botão play." }
      - name: social
        label: Social media
        file: tenner-site/content/galeria/social.json
        fields:
          - { label: Nome da categoria, name: label, widget: hidden, default: "Social media" }
          - label: Imagens
            name: items
            widget: list
            label_singular: imagem
            add_to_top: true
            collapsed: false
            summary: "{{fields.title}}"
            hint: "Carrega em “Adicionar imagem” para pôr uma nova. Arrasta para mudar a ordem; o X apaga."
            fields:
              - { label: Imagem, name: image, widget: image }
              - { label: Título, name: title, widget: string, required: false, hint: "Aparece por cima da imagem no site." }
              - label: Formato
                name: format
                widget: select
                default: quadrado
                options:
                  - { label: "Vertical (9:16)", value: vertical }
                  - { label: "Retrato (4:5)", value: retrato }
                  - { label: "Quadrado (1:1)", value: quadrado }
              - { label: Etiqueta, name: tag, widget: string, required: false, hint: "Ex.: Design, Motion, Vídeo, Social" }
              - { label: "Vídeo em .mp4", name: video, widget: file, required: false, hint: "Se puseres um vídeo, a imagem serve de capa e aparece o botão play." }

  # ---------------- PLANOS ----------------
  - name: planos
    label: Planos e preços
    label_singular: plano
    description: "Cada plano é uma entrada: nome e o que inclui."
    folder: tenner-site/content/planos
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}-{{slug}}"
    summary: "{{name}} {{suffix}}"
    editor: { preview: false }
    sortable_fields: [ordem, name]
    fields:
      - { label: Nome, name: name, widget: string, hint: "Ex.: TENNER ou TENNER+" }
      - { label: Sufixo em itálico, name: suffix, widget: string, required: false, hint: "Ex.: PRO (deixa vazio nos outros)" }
      - { label: "Destacar como “Mais completo”", name: featured, widget: boolean, default: false }
      - label: O que inclui
        name: features
        widget: list
        label_singular: linha
        summary: "{{fields.text}} {{fields.offer}}"
        fields:
          - { label: Texto, name: text, widget: string, required: false }
          - { label: "Oferta (aparece a amarelo com “+ OFERTA”)", name: offer, widget: string, required: false }
          - { label: Detalhe (texto pequeno por baixo), name: detail, widget: string, required: false }
      - { label: Ordem, name: ordem, widget: number, value_type: int, default: 100, hint: "Números mais baixos aparecem primeiro (10, 20, 30…)." }
      - { label: Mostrar no site, name: visivel, widget: boolean, default: true }

  # ---------------- O QUE FAZEMOS ----------------
  - name: servicos
    label: O que fazemos
    label_singular: serviço
    folder: tenner-site/content/servicos
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    summary: "{{title}}"
    editor: { preview: false }
    sortable_fields: [ordem, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descrição, name: text, widget: text }
      - { label: Ordem, name: ordem, widget: number, value_type: int, default: 100 }
      - { label: Mostrar no site, name: visivel, widget: boolean, default: true }

  # ---------------- SERVIÇOS EXTRA ----------------
  - name: extras
    label: Serviços extra
    label_singular: serviço extra
    folder: tenner-site/content/extras
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    summary: "{{title}}"
    editor: { preview: false }
    sortable_fields: [ordem, title]
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Subtítulo, name: subtitle, widget: string }
      - { label: Texto ao abrir, name: text, widget: text, required: false }
      - { label: Destacar a amarelo, name: highlight, widget: boolean, default: false }
      - { label: Ordem, name: ordem, widget: number, value_type: int, default: 100 }
      - { label: Mostrar no site, name: visivel, widget: boolean, default: true }

  # ---------------- DEFINIÇÕES ----------------
  - name: definicoes
    label: Definições gerais
    editor: { preview: false }
    files:
      - name: geral
        label: "Início, Sobre nós, Contacto e textos das secções"
        file: tenner-site/content/site.json
        fields:
          - label: Início (hero)
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Linha acima do título, name: eyebrow, widget: string }
              - { label: Slogan, name: tagline, widget: string }
              - { label: Texto de apresentação, name: intro, widget: text }
              - { label: "Imagem 1 (vertical, com moldura amarela)", name: image1, widget: image }
              - { label: "Imagem 2 (vertical 9:16)", name: image2, widget: image }
              - { label: "Imagem 3 (quadrada)", name: image3, widget: image }
          - label: Faixa amarela (palavras em movimento)
            name: marquee
            widget: list
            field: { label: Palavra, name: word, widget: string }
          - label: Sobre nós
            name: about
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Parágrafo 1, name: paragraph1, widget: text }
              - { label: Parágrafo 2, name: paragraph2, widget: text }
              - label: Para quem (etiquetas)
                name: audience
                widget: list
                field: { label: Etiqueta, name: label, widget: string }
          - { label: "Texto de introdução — O que fazemos", name: servicos_intro, widget: text }
          - { label: "Texto de introdução — Serviços extra", name: extras_intro, widget: text }
          - label: Contacto
            name: contact
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Subtítulo, name: subtitle, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Instagram (sem @), name: instagram, widget: string }
