# Painel de administração TENNER. (Decap CMS)
# Login com Netlify Identity; cada publicação faz um commit no GitHub e o Netlify reconstrói o site.
# Os ficheiros estão dentro da pasta tenner-site/ do repositório.
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "Novo em {{collection}}: “{{slug}}”"
    update: "Atualiza {{collection}}: “{{slug}}”"
    delete: "Apaga de {{collection}}: “{{slug}}”"
    uploadMedia: "Envia “{{path}}”"
    deleteMedia: "Apaga “{{path}}”"

locale: pt
site_url: https://tenner10.netlify.app
display_url: https://tenner10.netlify.app
logo_url: /images/logo-admin.svg

media_folder: tenner-site/images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------------- ARQUIVO ----------------
  - name: arquivo
    label: Arquivo
    description: "O Arquivo tem 3 secções: Pre Match Estático (fotos), Motion Videos (vídeos) e Social Media (carrosséis)."
    editor: { preview: false }
    files:
      - name: estatico
        label: "Pre Match Estático"
        file: tenner-site/content/galeria/estatico.json
        fields:
          - { label: Nome, name: title, widget: string, default: "Pre Match Estático" }
          - label: Fotos
            name: items
            widget: list
            label_singular: foto
            add_to_top: true
            collapsed: false
            summary: "Foto"
            fields:
              - { label: Foto, name: image, widget: image, choose_url: false }
              - { label: Descrição, name: title, widget: hidden, required: false }
              - { label: "Mostrar no site", name: ativo, widget: boolean, default: true }
      - name: motion
        label: "Motion Videos"
        file: tenner-site/content/galeria/motion.json
        fields:
          - { label: Nome, name: title, widget: string, default: "Pre Match Motion Videos" }
          - label: Vídeos
            name: items
            widget: list
            label_singular: vídeo
            add_to_top: true
            collapsed: false
            summary: "Vídeo"
            fields:
              - { label: "Vídeo (.mp4)", name: video, widget: file, choose_url: false }
              - { label: Descrição, name: title, widget: hidden, required: false }
              - { label: "Mostrar no site", name: ativo, widget: boolean, default: true }
      - name: social
        label: "Social Media"
        file: tenner-site/content/galeria/carrosseis.json
        fields:
          - { label: Nome, name: title, widget: string, default: "Conteúdos Social Media" }
          - label: Carrosséis
            name: items
            widget: list
            label_singular: carrossel
            add_to_top: true
            collapsed: false
            summary: "Carrossel"
            fields:
              - { label: Nome do carrossel, name: title, widget: hidden, required: false }
              - label: Fotos
                name: images
                widget: list
                label_singular: foto
                collapsed: false
                field: { label: Foto, name: image, widget: image, choose_url: false }
              - { label: "Mostrar no site", name: ativo, widget: boolean, default: true }

  # ---------------- PLANOS ----------------
  - name: planos
    label: Plano
    label_singular: plano
    description: "Os planos que aparecem no site. Carrega num plano para o editar."
    folder: tenner-site/content/planos
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}-{{slug}}"
    summary: "{{name}} {{suffix}}"
    editor: { preview: false }
    sortable_fields: [name]
    fields:
      - { label: Nome, name: name, widget: string, hint: "Ex.: TENNER, TENNER+ ou TENNER PRO" }
      - { label: Sufixo, name: suffix, widget: hidden, required: false }
      - { label: "O mais pedido", name: featured, widget: boolean, default: false, hint: "Mostra no site a etiqueta “O mais pedido” neste plano, para o cliente ver que é o que mais clientes escolhem." }
      - { label: "Mensagem do WhatsApp (botão “Quero”)", name: whatsapp_message, widget: string, required: false, hint: "Texto que já aparece escrito no WhatsApp quando o cliente carrega no botão deste plano. Se deixares vazio, usa a mensagem padrão das Definições gerais. O número/link do WhatsApp está em Definições gerais → WhatsApp." }
      - label: O que inclui
        name: features
        widget: list
        label_singular: linha
        summary: "{{fields.text}} {{fields.offer}}"
        fields:
          - { label: Texto, name: text, widget: string, required: false }
          - { label: "Oferta (aparece a amarelo com “+ OFERTA”)", name: offer, widget: string, required: false }
          - { label: Detalhe (texto pequeno por baixo), name: detail, widget: string, required: false }
      - { label: Ordem, name: ordem, widget: hidden, default: 100 }
      - { label: Mostrar no site, name: visivel, widget: boolean, default: true }

  # ---------------- O QUE FAZEMOS ----------------
  - name: servicos
    label: O que fazemos
    label_singular: serviço
    description: "Os serviços que aparecem na secção “O que fazemos” do site. Carrega num serviço para o editar."
    folder: tenner-site/content/servicos
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    summary: "{{title}}"
    editor: { preview: false }
    sortable_fields: [title]
    fields:
      - { label: Nome, name: title, widget: string }
      - { label: Descrição, name: text, widget: text }
      - { label: Ordem, name: ordem, widget: hidden, default: 100 }
      - { label: Mostrar no site, name: visivel, widget: boolean, default: true }

  # ---------------- SERVIÇOS EXTRA ----------------
  - name: extras
    label: Serviços extra
    label_singular: serviço extra
    description: "Os serviços extra que aparecem no site. Carrega num serviço para o editar."
    folder: tenner-site/content/extras
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    summary: "{{title}}"
    editor: { preview: false }
    sortable_fields: [title]
    fields:
      - { label: Nome, name: title, widget: string }
      - { label: Descrição, name: text, widget: text, required: false }
      - { label: Subtítulo, name: subtitle, widget: hidden, required: false }
      - { label: Destacar a amarelo, name: highlight, widget: hidden, default: false }
      - { label: Ordem, name: ordem, widget: hidden, default: 100 }
      - { label: Mostrar no site, name: visivel, widget: boolean, default: true }

  # ---------------- DEFINIÇÕES ----------------
  - name: definicoes
    label: Definições gerais
    editor: { preview: false }
    files:
      - name: geral
        label: "Início, Sobre nós, Contacto e textos das secções"
        file: tenner-site/content/site.json
        fields:
          - label: Início (hero)
            name: hero
            widget: object
            collapsed: false
            fields:
              - { label: Linha acima do título, name: eyebrow, widget: string }
              - { label: Slogan, name: tagline, widget: string }
              - { label: Texto de apresentação, name: intro, widget: text }
              - { label: "Imagem 1 (vertical, com moldura amarela)", name: image1, widget: image }
              - { label: "Imagem 2 (vertical 9:16)", name: image2, widget: image }
              - { label: "Imagem 3 (quadrada)", name: image3, widget: image }
          - label: Faixa amarela (palavras em movimento)
            name: marquee
            widget: list
            field: { label: Palavra, name: word, widget: string }
          - label: Sobre nós
            name: about
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Parágrafo 1, name: paragraph1, widget: text }
              - { label: Parágrafo 2, name: paragraph2, widget: text }
              - label: Para quem (etiquetas)
                name: audience
                widget: list
                field: { label: Etiqueta, name: label, widget: string }
          - label: WhatsApp (botões dos planos)
            name: whatsapp
            widget: object
            collapsed: false
            fields:
              - { label: "Link do WhatsApp", name: link, widget: string, required: false, hint: "Ex.: https://wa.me/351912345678 (indicativo 351 + número, sem espaços nem +). Também podes pôr só o número. Se ficar vazio, os botões dos planos levam à secção de Contacto." }
              - { label: "Mensagem padrão", name: message, widget: string, required: false, default: "Olá! Tenho interesse no plano {plano} da TENNER.", hint: "Usada nos planos que não têm mensagem própria. {plano} é trocado pelo nome do plano." }
          - { label: "Texto de introdução — O que fazemos", name: servicos_intro, widget: text }
          - { label: "Texto de introdução — Serviços extra", name: extras_intro, widget: text }
          - label: Contacto
            name: contact
            widget: object
            fields:
              - { label: Título, name: title, widget: string }
              - { label: Subtítulo, name: subtitle, widget: string }
              - { label: Email, name: email, widget: string }
              - { label: Instagram (sem @), name: instagram, widget: string }
